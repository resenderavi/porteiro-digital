<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Porteiro Digital - Registo de Visitantes</title>
    
    <style>
        html, body { 
            margin: 0; 
            overflow: hidden; 
            height: 100%; 
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        
        * { 
            cursor: none; 
        }
        
        body { 
            font-size: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        
        input, button { 
            font-size: 1.2rem; 
            min-height: 60px; 
            margin: 10px 0; 
            width: 100%; 
            max-width: 500px; 
            box-sizing: border-box; 
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        
        button { 
            background-color: #004c97; 
            color: white; 
            border: none; 
            font-weight: bold; 
        }
        
        button.voltar { 
            background-color: #e0e0e0; 
            color: #333; 
        }

        button.confirmar {
            background-color: #28a745; 
        }
        
        .passo { 
            display: none; 
            width: 90%; 
            max-width: 600px; 
            text-align: center; 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        
        .passo.ativo { 
            display: block; 
        }
        
        h2 { color: #333; margin-top: 0; font-size: 1.8rem; }
        
        #resumo {
            text-align: left;
            margin: 20px auto;
            max-width: 400px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="passo1" class="passo ativo">
        <h2>Bem-vindo!</h2>
        <p>Por favor, insira os seus dados para iniciar o registo.</p>
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="text" id="cpf" placeholder="CPF (ex: 123.456.789-00)" required>
        <button onclick="proximoPasso(1, 2)">Próximo</button>
    </div>

    <div id="passo2" class="passo">
        <h2>Detalhes da Visita</h2>
        <input type="text" id="motivo" placeholder="Motivo da visita" required>
        <input type="text" id="responsavel" placeholder="Responsável a visitar" required>
        <button class="voltar" onclick="proximoPasso(2, 1)">Voltar</button>
        <button onclick="proximoPasso(2, 3)">Próximo</button>
    </div>

    <div id="passo3" class="passo">
        <h2>Confirmação</h2>
        <p>Verifique se os dados estão corretos:</p>
        <div id="resumo"></div>
        <button class="voltar" onclick="proximoPasso(3, 2)">Voltar</button>
        <button class="confirmar" onclick="enviarFormulario()">Confirmar e Enviar</button>
    </div>

    <div id="passo4" class="passo">
        <h2>Registo Concluído!</h2>
        <p>Por favor, aguarde a autorização na receção.</p>
    </div>

    <script>
        function proximoPasso(atual, proximo) {
            if (proximo === 3) {
                const nome = document.getElementById('nome').value || 'Não preenchido';
                const cpf = document.getElementById('cpf').value || 'Não preenchido';
                const motivo = document.getElementById('motivo').value || 'Não preenchido';
                const responsavel = document.getElementById('responsavel').value || 'Não preenchido';
                
                document.getElementById('resumo').innerHTML = `
                    <p><strong>Nome:</strong> ${nome}</p>
                    <p><strong>CPF:</strong> ${cpf}</p>
                    <p><strong>Motivo:</strong> ${motivo}</p>
                    <p><strong>Responsável:</strong> ${responsavel}</p>
                `;
            }

            document.getElementById('passo' + atual).classList.remove('ativo');
            document.getElementById('passo' + proximo).classList.add('ativo');
        }

        function enviarFormulario() {
            proximoPasso(3, 4);
            
            setTimeout(() => {
                document.getElementById('nome').value = '';
                document.getElementById('cpf').value = '';
                document.getElementById('motivo').value = '';
                document.getElementById('responsavel').value = '';
                proximoPasso(4, 1);
            }, 5000);
        }
    </script>
</body>
</html>
